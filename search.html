<!DOCTYPE html>
<html>
<head>
    <title>Search</title>
</head>
<body>

<input type="text" id="searchBox" placeholder="Search One Island..." />
<div id="results"></div>

<script>
const pages = [
  { title: "Home", url: "index.html", text: "One Island secure voice reconstruction T3E cyber defense" },
  { title: "Sea", url: "domains/sea.html", text: "sea maritime naval unmanned systems secure communications" },
  { title: "Land", url: "domains/land.html", text: "land tactical ground systems defense operations" },
  { title: "Air", url: "domains/air.html", text: "air drones aviation autonomous systems" },
  { title: "Space", url: "domains/space.html", text: "space satellite orbital communications" },
  { title: "Cyber", url: "domains/cyber.html", text: "cyber encryption T3E secure voice data" },
  { title: "Subsurface", url: "domains/subsurface.html", text: "subsurface underwater autonomous systems" },
  { title: "Contact", url: "contact.html", text: "contact partnership business inquiries" }
];

document.getElementById('searchBox').addEventListener('input', function() {
    if (search.trim() === "") {
    document.getElementById('results').innerHTML = "";
    return;
    }
    const search = this.value.toLowerCase();

    const results = pages.filter(page =>
        page.title.toLowerCase().includes(search) ||
        page.text.toLowerCase().includes(search)
    );

    if (results.length === 0) {
    document.getElementById('results').innerHTML =
        "<p>No results found.</p>";
} else {
    document.getElementById('results').innerHTML =
        results.map(page =>
            `<p><a href="${page.url}">${page.title}</a></p>`
        ).join('');
}
});
</script>

</body>
</html>
