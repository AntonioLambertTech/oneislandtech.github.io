<head>
  <meta charset="UTF-8" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --white: #FFFFFF; --off: #F4F5F7; --rule: #E0E3E8;
      --muted: #8A939E; --mid: #4A5568; --dark: #1A202C;
      --navy: #0A1628; --blue: #0050A0; --blue2: #003878; --signal: #00C896;
    }
    html, body {
      height: 100%;
      background: #06090F;
      color: var(--white);
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* NAV */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 200;
      background: #06090F;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .nav-utility {
      background: #030508;
      padding: 0 2.5rem;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 1.5rem;
    }
    .nav-utility a {
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.3);
      text-decoration: none;
      transition: color 0.2s;
    }
    .nav-utility a:hover { color: rgba(255,255,255,0.7); }
    .nav-main {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2.5rem;
      height: 72px;
    }
    .nav-logo {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      text-decoration: none;
    }
    .nav-logo img {
      width: 36px; height: 36px;
      object-fit: contain;
      display: block;
      filter: brightness(0) invert(1);
    }
    .nav-logo-text { display: flex; flex-direction: column; line-height: 1; }
    .nav-logo-name {
      font-size: 1.15rem; font-weight: 700;
      color: rgba(255,255,255,0.9);
      letter-spacing: 0.06em; text-transform: uppercase;
    }
    .nav-logo-sub {
      font-size: 0.6rem; font-weight: 500;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: rgba(255,255,255,0.25); margin-top: 3px;
    }
    .nav-links {
      display: flex; align-items: stretch;
      list-style: none; height: 72px;
    }
    .nav-links > li { position: relative; display: flex; align-items: center; }
    .nav-links > li > a {
      display: flex; align-items: center; gap: 0.35rem;
      padding: 0 1.25rem; height: 100%;
      font-size: 0.82rem; font-weight: 600;
      letter-spacing: 0.04em; text-transform: uppercase;
      color: rgba(255,255,255,0.55); text-decoration: none;
      border-bottom: 3px solid transparent;
      transition: color 0.2s, border-color 0.2s;
      white-space: nowrap;
    }
    .nav-links > li > a:hover {
      color: rgba(255,255,255,0.9);
      border-bottom-color: var(--signal);
    }
    .nav-chevron { font-size: 0.55rem; transition: transform 0.2s; }
    .nav-links > li:hover .nav-chevron { transform: rotate(180deg); }
    .nav-dropdown {
      position: absolute; top: 100%; left: 0;
      min-width: 200px;
      background: #0D1117;
      border-top: 2px solid var(--signal);
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      opacity: 0; pointer-events: none;
      transform: translateY(-6px);
      transition: opacity 0.2s, transform 0.2s;
      z-index: 300;
    }
    .nav-links > li:hover .nav-dropdown {
      opacity: 1; pointer-events: all; transform: translateY(0);
    }
    .nav-dropdown a {
      display: block; padding: 0.85rem 1.25rem;
      font-size: 0.82rem; font-weight: 500;
      color: rgba(255,255,255,0.55); text-decoration: none;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      transition: background 0.15s, color 0.15s;
    }
    .nav-dropdown a:last-child { border-bottom: none; }
    .nav-dropdown a:hover { background: rgba(255,255,255,0.04); color: var(--signal); }

    /* FULL PAGE LAYOUT */
    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 104px 2.5rem 4rem;
      position: relative;
      overflow: hidden;
    }

    /* Subtle starfield */
    .page::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(1px 1px at 12% 18%, rgba(255,255,255,0.25) 0%, transparent 100%),
        radial-gradient(1px 1px at 28% 42%, rgba(255,255,255,0.15) 0%, transparent 100%),
        radial-gradient(1px 1px at 45% 8%, rgba(255,255,255,0.2) 0%, transparent 100%),
        radial-gradient(1px 1px at 62% 55%, rgba(255,255,255,0.12) 0%, transparent 100%),
        radial-gradient(1px 1px at 78% 28%, rgba(255,255,255,0.18) 0%, transparent 100%),
        radial-gradient(1px 1px at 88% 72%, rgba(255,255,255,0.15) 0%, transparent 100%),
        radial-gradient(1px 1px at 8% 80%, rgba(255,255,255,0.1) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 50% 88%, rgba(0,200,150,0.2) 0%, transparent 100%),
        radial-gradient(1px 1px at 92% 15%, rgba(0,200,150,0.15) 0%, transparent 100%);
      pointer-events: none;
    }

    .labs-content {
      position: relative;
      z-index: 2;
      text-align: center;
      max-width: 700px;
    }

    .labs-label {
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(0,200,150,0.6);
      margin-bottom: 3rem;
    }

    .labs-line1 {
      font-size: clamp(1.5rem, 4vw, 2.8rem);
      font-weight: 300;
      color: rgba(255,255,255,0.5);
      line-height: 1.4;
      margin-bottom: 0.5rem;
    }

    .labs-line2 {
      font-size: clamp(1.5rem, 4vw, 2.8rem);
      font-weight: 600;
      color: rgba(255,255,255,0.9);
      line-height: 1.4;
    }

    .labs-divider {
      width: 40px;
      height: 1px;
      background: rgba(0,200,150,0.4);
      margin: 3rem auto;
    }

    .labs-sub {
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.2);
    }

    @media (max-width: 768px) {
      .nav-links { display: none; }
      .nav-utility { display: none; }
    }
  </style>
</head>
